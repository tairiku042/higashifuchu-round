<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高機能ラウンド台帳入力フォーム</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f0f2f5; color: #333; }
    .container { max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
    h2 { text-align: center; color: #007bff; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    input:focus, select:focus, textarea:focus { border-color: #007bff; outline: none; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; }
    
    .qr-section { background: #f8f9fa; padding: 15px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px; }
    
    .bike-warning { display: none; margin-top: 8px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px; font-weight: bold; font-size: 14px; text-align: center; }

    /* Yahoo路線検索ボタン用のスタイル */
    .yahoo-btn { display: inline-block; width: 100%; padding: 8px; background-color: #ff0033; color: white; text-align: center; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; margin-bottom: 12px; font-size: 14px; }
    .yahoo-btn:hover { background-color: #cc0029; }

    #routeFields { display: none; }

    .qr-btn { background: #28a745; margin-bottom: 10px; }
    .qr-btn:hover { background: #218838; }
    #video-container { display: none; text-align: center; margin-bottom: 20px; position: relative; }
    #qr-video { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #28a745; }
    .close-scan { background: #dc3545; padding: 6px 12px; font-size: 14px; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>ラウンド台帳登録</h2>
  
  <form id="roundForm">
    <div class="form-group">
      <label for="planner">担当プランナー名 *</label>
      <select id="planner" required>
        <option value="">選択してください</option>
        <option value="木幡">木幡</option>
        <option value="村田">村田</option>
        <option value="前田">前田</option>
        <option value="小田川">小田川</option>
        <option value="黒石">黒石</option>
        <option value="佐藤">佐藤</option>
        <option value="下河原">下河原</option>
        <option value="伊藤">伊藤</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">ラウンド日 *</label>
      <input type="date" id="date" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="customerId">会員番号 *</label>
        <input type="text" id="customerId" placeholder="例: 12345" required>
      </div>
      <div class="form-group">
        <label for="customerName">お客様名（苗字カナ入力） *</label>
        <input type="text" id="customerName" placeholder="例: ヤマダ" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="startTime">出発時間 *</label>
        <input type="time" id="startTime" required>
      </div>
      <div class="form-group">
        <label for="endTime">戻り時間 *</label>
        <input type="time" id="endTime" required>
      </div>
    </div>

    <div class="form-group">
      <label for="workFee">想定作業料金 (円) ※商品代も含めて入力 *</label>
      <input type="number" id="workFee" placeholder="例: 5000" required>
    </div>

    <div class="form-group">
      <label for="workContent">作業内容</label>
      <textarea id="workContent" rows="3" placeholder="作業の詳細を記載"></textarea>
    </div>

    <div class="form-group">
      <label for="transport">移動手段 *</label>
      <select id="transport" required onchange="toggleTransportFields()">
        <option value="">選択してください</option>
        <option value="公共交通機関">公共交通機関</option>
        <option value="自転車">自転車</option>
        <option value="徒歩">徒歩</option>
        <option value="車">車</option>
      </select>
      <div id="bikeWarning" class="bike-warning">
        ⚠️ 自転車移動時は必ずヘルメットを着用してください！
      </div>
    </div>

    <!-- 公共交通機関を選択した場合のみ表示 -->
    <div id="routeFields">
      <button type="button" class="yahoo-btn" onclick="openYahooTransit()">🔍 Yahoo!路線情報で検索する（自動入力）</button>
      
      <div class="row">
        <div class="form-group">
          <label for="stationFrom">出発場所</label>
          <input type="text" id="stationFrom" placeholder="例: 東府中駅">
        </div>
        <div class="form-group">
          <label for="stationTo">到着場所</label>
          <input type="text" id="stationTo" placeholder="例: 調布駅">
        </div>
      </div>

      <div class="form-group">
        <label for="fare">運賃 (円)</label>
        <input type="number" id="fare" placeholder="例: 220">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="onsite">会員区分</label>
        <select id="onsite">
          <option value="ONSITE">ONSITE</option>
          <option value="OFFSITE">OFFSITE</option>
        </select>
      </div>
      <div class="form-group">
        <label for="asset">Asset数</label>
        <input type="number" id="asset" value="0">
      </div>
    </div>

    <!-- 🔒 ⑪ 第三者チェック（必須）エリア -->
    <div class="qr-section">
      <label style="font-size: 16px;">🔒 ⑪ 第三者チェック（必須）</label>
      
      <div style="text-align: left; margin: 10px 0; background: #ffffff; padding: 12px; border-radius: 5px; font-size: 14px; border: 1px solid #e0e0e0;">
        <label style="font-weight: normal; margin-bottom: 8px; display: block;">
          <input type="checkbox" required style="width: auto; margin-right: 5px;"> 🪪 免許証はあるか？
        </label>
        <label style="font-weight: normal; margin-bottom: 8px; display: block;">
          <input type="checkbox" required style="width: auto; margin-right: 5px;"> 📱 ラウンド用携帯を持っているか？
        </label>
        <label style="font-weight: normal; margin-bottom: 8px; display: block;">
          <input type="checkbox" required style="width: auto; margin-right: 5px;"> 📁 個人情報管理は適切か？
        </label>
        <label style="font-weight: normal; margin-bottom: 8px; display: block;">
          <input type="checkbox" required style="width: auto; margin-right: 5px;"> 💴 会計がある場合、釣銭を持っているか？
        </label>
      </div>

      <div style="color: #dc3545; font-weight: bold; font-size: 13px; margin-bottom: 12px; line-height: 1.4;">
        🚨 移動手段に関わらず、ラウンドからBASEへの戻りなし（直帰）は原則禁止です！
      </div>

      <button type="button" class="qr-btn" onclick="startScanner()">📷 QRコードを読み取る</button>
      
      <div id="video-container">
        <video id="qr-video" playsinline></video><br>
        <button type="button" class="close-scan" onclick="stopScanner()">スキャン中止</button>
      </div>

      <input type="text" id="verifier" placeholder="QR読取で自動入力されます" readonly required style="margin-top: 5px;">
    </div>

    <button type="submit" id="submitBtn">送信する</button>
  </form>
</div>

<script>
  // ★ここに各ベース用のGAS URLを設定してください★
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYnxQOPP3SmF1_7oc75ZYR-ET6KlZ3EqjathreLSUJocxbC3CshixB3SHDTfFImHj90w/exec";

  document.getElementById('date').valueAsDate = new Date();

  function toggleTransportFields() {
    const transport = document.getElementById('transport').value;
    const routeFields = document.getElementById('routeFields');
    const bikeWarning = document.getElementById('bikeWarning');

    if (transport === '自転車') {
      bikeWarning.style.display = 'block';
    } else {
      bikeWarning.style.display = 'none';
    }

    if (transport === '公共交通機関') {
      routeFields.style.display = 'block';
    } else {
      routeFields.style.display = 'none';
    }
  }

  // 出発場所と到着場所を引き継いでYahoo!路線情報を開く処理
  function openYahooTransit() {
    const from = encodeURIComponent(document.getElementById('stationFrom').value.trim());
    const to = encodeURIComponent(document.getElementById('stationTo').value.trim());
    
    let url = "https://transit.yahoo.co.jp/";
    if (from || to) {
      url = `https://transit.yahoo.co.jp/search/result?from=${from}&to=${to}`;
    }
    
    window.open(url, '_blank');
  }

  let videoStream = null;
  let animationFrameId = null;

  const memberMap = {
    'CHECK-KOHATA': '木幡',
    'CHECK-MURATA': '村田',
    'CHECK-MAEDA': '前田',
    'CHECK-ODAGAWA': '小田川',
    'CHECK-KUROISHI': '黒石',
    'CHECK-SATO': '佐藤',
    'CHECK-SHIMOGAWARA': '下河原',
    'CHECK-ITO': '伊藤'
  };

  function startScanner() {
    const video = document.getElementById('qr-video');
    const container = document.getElementById('video-container');
    container.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function(stream) {
        videoStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        animationFrameId = requestAnimationFrame(tick);
      })
      .catch(function(err) {
        alert("カメラへのアクセスが拒否されたか、対応していません: " + err);
        container.style.display = 'none';
      });
  }

  function tick() {
    const video = document.getElementById('qr-video');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert",
      });

      if (code) {
        const rawData = code.data.trim();
        if (memberMap[rawData]) {
          document.getElementById('verifier').value = memberMap[rawData];
          stopScanner();
          alert("第三者チェック者: 「" + memberMap[rawData] + "」さんを登録しました。");
          return;
        } else {
          document.getElementById('verifier').value = rawData;
          stopScanner();
          alert("読み取り完了: " + rawData);
          return;
        }
      }
    }
    animationFrameId = requestAnimationFrame(tick);
  }

  function stopScanner() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
    }
    document.getElementById('video-container').style.display = 'none';
  }

  document.getElementById('roundForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = '送信中...';

    const payload = {
      planner: document.getElementById('planner').value,
      date: document.getElementById('date').value,
      customerId: document.getElementById('customerId').value,
      customerName: document.getElementById('customerName').value,
      startTime: document.getElementById('startTime').value,
      endTime: document.getElementById('endTime').value,
      workFee: document.getElementById('workFee').value,
      workContent: document.getElementById('workContent').value,
      transport: document.getElementById('transport').value,
      stationFrom: document.getElementById('stationFrom').value,
      stationTo: document.getElementById('stationTo').value,
      fare: document.getElementById('fare').value,
      onsite: document.getElementById('onsite').value,
      asset: document.getElementById('asset').value,
      verifier: document.getElementById('verifier').value
    };

    fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert('送信が完了しました！');
      document.getElementById('roundForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      toggleTransportFields();
    })
    .catch(error => {
      alert('エラーが発生しました: ' + error);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = '送信する';
    });
  });
</script>

</body>
</html>
